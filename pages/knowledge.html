<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投资知识库 · 从原理到实践</title>
<link rel="stylesheet" href="../assets/css/main.css">
<style>
/* 近期市场实例：最小增量样式（配色沿用全局红涨绿跌变量） */
.kb-inst-dot { display:inline-block; width:8px; height:8px; border-radius:50%;
  margin-right:7px; vertical-align:1px; }
.kb-inst-dot.bull { background:var(--up); }
.kb-inst-dot.bear { background:var(--down); }
.kb-inst-dot.neutral { background:#b9c0c9; }
.kb-inst-row { font-size:13px; line-height:2; color:var(--text-2); }
.kb-inst-row .d { font-family:var(--mono); font-size:12px; color:var(--text-3); margin-right:8px; }
.kb-only-inst { display:flex; align-items:center; gap:6px; margin:10px 0 2px;
  font-size:13px; color:var(--text-2); cursor:pointer; user-select:none; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="../index.html"><span class="dot"></span>投资辅助站</a>
    <nav class="nav">
      <a href="../index.html" data-nav="index">首页</a>
      <a href="market.html" data-nav="market">行情看板</a>
      <a href="review.html" data-nav="review">信号回看</a>
      <a href="knowledge.html" data-nav="knowledge">知识库</a>
      <a href="books.html" data-nav="books">书单</a>
      <a href="mindset.html" data-nav="mindset">投资心理</a>
      <a href="tools.html" data-nav="tools">决策工具</a>
      <a href="mydata.html" data-nav="mydata">我的数据</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>投资知识库</h1>
    <p id="subhead">正在加载…</p>
  </div>

  <div id="notice"></div>

  <div class="kb-layout">
    <aside class="kb-side">
      <input type="text" class="kb-search" id="search" placeholder="搜索条目、标签…">
      <label class="kb-only-inst" id="onlyInstWrap" style="display:none">
        <input type="checkbox" id="onlyInst"> 仅看近期有实例
      </label>
      <div id="reviewPanel"></div>
      <div id="cats"></div>
      <div class="small muted" style="margin-top:14px;line-height:1.6">
        点击标题展开正文。<br>每个条目含核心要点、常见陷阱与关联阅读。
      </div>
    </aside>

    <section>
      <div id="items"></div>
    </section>
  </div>

  <div id="disclaimer"></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>投资知识库 · 内容仅供学习参考</span>
    <span id="count"></span>
  </div>
</footer>

<script src="../assets/js/app.js"></script>
<script>
(function () {
  'use strict';
  APP.mountNav('knowledge');
  document.getElementById('disclaimer').innerHTML = APP.disclaimer();

  var DATA = null, activeCat = 'all', keyword = '';
  var INSTANCES = null;   // { 条目id: { days: 引用交易日数, list: [{date,title,type}] } }，加载失败保持 null 静默降级
  var onlyInst = false;   // 「仅看近期有实例」开关

  // ---------------------------------------------- 间隔复习（简易 SM-2）
  var LS_RV = 'invest_kb_review';
  var RV_INTERVALS = [1, 3, 7, 14, 30, 60, 120]; // 天
  function lsGet(k, def) {
    try { return JSON.parse(localStorage.getItem(k)) || def; }
    catch (e) { return def; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }
  function today() { return new Date().toISOString().slice(0, 10); }
  function addDays(n) {
    var d = new Date();
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function rvState() { return lsGet(LS_RV, {}); }
  function isDue(id) {
    var r = rvState()[id];
    return r ? r.due <= today() : false; // 从未学过的条目不强制，点击"开始学习"才入队
  }
  function gradeItem(id, good) {
    var st = rvState();
    var r = st[id] || { box: 0 };
    r.box = good ? Math.min(r.box + 1, RV_INTERVALS.length - 1) : 0;
    r.due = addDays(RV_INTERVALS[r.box]);
    r.last = today();
    st[id] = r;
    lsSet(LS_RV, st);
  }
  function updateReviewPanel() {
    if (!DATA) return;
    var st = rvState();
    var learned = Object.keys(st).length;
    var due = DATA.items.filter(function (i) { return isDue(i.id); }).length;
    var mastered = Object.keys(st).filter(function (k) { return st[k].box >= 5; }).length;
    document.getElementById('reviewPanel').innerHTML =
      '<div class="card" style="margin:12px 0;padding:12px">' +
      '<div style="font-weight:600;font-size:14px;margin-bottom:6px">📚 间隔复习</div>' +
      '<div class="small" style="line-height:1.8">已入队 ' + learned + ' / ' + DATA.items.length +
      ' · 已掌握 ' + mastered + '</div>' +
      '<div class="kb-cat' + (activeCat === '__due__' ? ' active' : '') + '" data-cat="__due__" ' +
      'style="margin-top:8px"><span>今日待复习</span><span class="cnt">' + due + '</span></div>' +
      '</div>';
  }

  APP.load('data/content/knowledge.json').then(function (d) {
    if (!d || !d.items) {
      document.getElementById('notice').innerHTML =
        APP.dataNotice(false, '未找到 data/content/knowledge.json');
      return;
    }
    DATA = d;
    document.getElementById('subhead').textContent =
      d.items.length + ' 个条目，覆盖 ' + d.categories.length + ' 个主题领域';
    document.getElementById('count').textContent = '共 ' + d.items.length + ' 条';
    renderCats();
    render();
    updateReviewPanel();
    // 支持从其他页面跳转定位：knowledge.html#kb-<id>
    if (location.hash && location.hash.indexOf('#kb-') === 0) {
      focusItem(location.hash.slice(4));
    }
  });

  // ---------------------------------------------- 近期市场实例（理论 → 实践）
  // 历史归档的信号只有 id/type/title，knowledge 关联需从规则引擎源码
  // scripts/lib/rules.py 的 sig.append({... "knowledge": [...]}) 块解析；
  // latest.json 的信号自带 knowledge 字段，优先使用。任一步失败均静默降级。
  var INST_DAYS = 60;    // 统计窗口：近 60 个自然日
  var INST_SHOW = 5;     // 展开区最多列出的实例数

  function parseSignalKnowledge(src) {
    var map = {};
    if (!src) return map;
    var blocks = src.split('sig.append({');
    for (var i = 1; i < blocks.length; i++) {
      var blk = blocks[i].split('})')[0];
      var mid = /"id":\s*"([^"]+)"/.exec(blk);
      var mkn = /"knowledge":\s*\[([\s\S]*?)\]/.exec(blk);
      if (!mid || !mkn) continue;
      var ids = [], km, kr = /"([^"]+)"/g;
      while ((km = kr.exec(mkn[1]))) ids.push(km[1]);
      if (ids.length) map[mid[1]] = ids;
    }
    return map;
  }

  function buildInstances(histDays, latest, sigMap) {
    var byDate = {};
    (histDays || []).forEach(function (d) {
      if (d && d.date && Array.isArray(d.signals)) byDate[d.date] = d;
    });
    // latest.json 用 trade_date 作为日期；同一天覆盖历史条目（其 signals 带完整 knowledge 字段）
    if (latest && latest.trade_date && Array.isArray(latest.signals)) {
      byDate[latest.trade_date] = { date: latest.trade_date, signals: latest.signals };
    }
    var cutoff = addDays(-INST_DAYS); // 'YYYY-MM-DD' 可直接字典序比较
    var out = {};
    Object.keys(byDate).forEach(function (date) {
      if (date < cutoff) return;
      var counted = {}; // 同一交易日同一条目只计 1 次
      byDate[date].signals.forEach(function (s) {
        if (!s || !s.id) return;
        var ks = (Array.isArray(s.knowledge) && s.knowledge.length) ? s.knowledge : (sigMap[s.id] || []);
        ks.forEach(function (k) {
          if (!out[k]) out[k] = { days: 0, list: [] };
          if (!counted[k]) { counted[k] = 1; out[k].days++; }
          out[k].list.push({
            date: date,
            title: s.title || s.id,
            type: (s.type === 'bull' || s.type === 'bear') ? s.type : 'neutral'
          });
        });
      });
    });
    Object.keys(out).forEach(function (k) {
      out[k].list.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      out[k].list = out[k].list.slice(0, INST_SHOW);
    });
    return out;
  }

  function loadInstances() {
    Promise.all([
      APP.loadAnalysisHistory(3),
      APP.load('data/analysis/latest.json'),
      APP.loadText('scripts/lib/rules.py')
    ]).then(function (rs) {
      var sigMap = parseSignalKnowledge(rs[2]);
      var inst = buildInstances(rs[0], rs[1], sigMap);
      if (!Object.keys(inst).length) return; // 无实例可显示，保持降级
      INSTANCES = inst;
      document.getElementById('onlyInstWrap').style.display = '';
      render();
    }).catch(function () { /* 静默降级：不显示实例区块 */ });
  }
  loadInstances();

  function countBy(cid) {
    if (cid === 'all') return DATA.items.length;
    return DATA.items.filter(function (i) { return i.category === cid; }).length;
  }

  function renderCats() {
    var html = '<div class="kb-cat' + (activeCat === 'all' ? ' active' : '') +
      '" data-cat="all"><span>全部</span><span class="cnt">' + countBy('all') + '</span></div>';
    html += DATA.categories.map(function (c) {
      return '<div class="kb-cat' + (activeCat === c.id ? ' active' : '') +
        '" data-cat="' + c.id + '" title="' + APP.esc(c.desc) + '">' +
        '<span>' + APP.esc(c.name) + '</span><span class="cnt">' + countBy(c.id) + '</span></div>';
    }).join('');
    document.getElementById('cats').innerHTML = html;
    updateReviewPanel(); // 面板中的"今日待复习"高亮随分类切换刷新
  }

  // 分类/复习过滤统一用事件委托，面板重渲染后点击仍有效
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('.kb-cat') : null;
    if (!el) return;
    activeCat = el.getAttribute('data-cat');
    renderCats();
    render();
  });

  function filtered() {
    var kw = keyword.trim().toLowerCase();
    return DATA.items.filter(function (i) {
      if (activeCat === '__due__' && !isDue(i.id)) return false;
      if (activeCat !== 'all' && activeCat !== '__due__' && i.category !== activeCat) return false;
      if (onlyInst && !(INSTANCES && INSTANCES[i.id])) return false;
      if (!kw) return true;
      var hay = [i.title, i.summary, i.id, (i.tags || []).join(' ')]
        .join(' ').toLowerCase();
      return hay.indexOf(kw) >= 0;
    });
  }

  function catName(cid) {
    var c = DATA.categories.filter(function (x) { return x.id === cid; })[0];
    return c ? c.name : cid;
  }

  function render() {
    var list = filtered();
    if (!list.length) {
      document.getElementById('items').innerHTML = APP.empty('未找到匹配的条目');
      return;
    }
    document.getElementById('items').innerHTML = list.map(function (i) {
      var inst = INSTANCES && INSTANCES[i.id];
      return '<div class="kb-item" id="kb-' + i.id + '" data-id="' + i.id + '">' +
        '<div class="kb-item-head">' +
          '<span class="arrow">▶</span>' +
          '<div style="flex:1">' +
            '<div class="kb-item-title">' + APP.esc(i.title) +
              ' <span class="tag tag-neutral" style="margin-left:6px">' + APP.esc(catName(i.category)) + '</span>' +
              ' <span class="tag ' + (i.level === '入门' ? 'tag-info' : 'tag-warn') + '">' + APP.esc(i.level) + '</span>' +
              (inst ? ' <span class="tag tag-info" title="近 ' + INST_DAYS + ' 天内有 ' + inst.days +
                ' 个交易日的市场信号引用了本条目">近期实例 ×' + inst.days + '</span>' : '') +
            '</div>' +
            '<div class="kb-item-sum">' + APP.esc(i.summary) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="kb-item-body">' +
          '<div class="kb-sec"><h4>核心要点</h4><ul class="kb-points">' +
            (i.points || []).map(function (p) { return '<li>' + APP.md2html(p) + '</li>'; }).join('') +
          '</ul></div>' +
          (inst
            ? '<div class="kb-sec"><h4>近期市场实例</h4>' +
              inst.list.map(function (x) {
                return '<div class="kb-inst-row">' +
                  '<span class="kb-inst-dot ' + x.type + '"></span>' +
                  '<span class="d">' + APP.esc(x.date) + '</span>' + APP.esc(x.title) + '</div>';
              }).join('') +
              '<div class="small muted" style="margin-top:6px">近 ' + INST_DAYS +
                ' 天内共 ' + inst.days + ' 个交易日出现 · ' +
                '<a href="review.html">查看规则复盘 →</a></div>' +
              '</div>' : '') +
          ((i.pitfalls || []).length
            ? '<div class="kb-sec"><h4>常见陷阱</h4>' +
              (i.pitfalls || []).map(function (p) { return '<div class="kb-pitfall">' + APP.md2html(p) + '</div>'; }).join('') +
              '</div>' : '') +
          ((i.related || []).length
            ? '<div class="kb-sec"><h4>关联阅读</h4><div class="kb-related">' +
              (i.related || []).map(function (r) {
                return '<button class="kb-rel-link" data-goto="' + r + '">' + APP.esc(r) + '</button>';
              }).join('') + '</div></div>' : '') +
          ((i.tags || []).length
            ? '<div class="kb-tags">' + (i.tags || []).map(function (t) {
                return '<span class="kb-tag">' + APP.esc(t) + '</span>';
              }).join('') + '</div>' : '') +
          '<div class="kb-review" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-strong);' +
            'display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
            '<span class="small muted rv-state" data-id="' + APP.esc(i.id) + '">' + rvLabel(i.id) + '</span>' +
            '<span style="flex:1"></span>' +
            '<button class="btn btn-sm" data-grade="bad"  data-id="' + APP.esc(i.id) + '">😅 再想想</button>' +
            '<button class="btn btn-sm" data-grade="good" data-id="' + APP.esc(i.id) + '">✅ 记住了</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    // 展开/收起
    Array.prototype.forEach.call(document.querySelectorAll('.kb-item-head'), function (h) {
      h.addEventListener('click', function () {
        h.parentNode.classList.toggle('open');
      });
    });
    // 复习评分
    Array.prototype.forEach.call(document.querySelectorAll('.kb-review [data-grade]'), function (b) {
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        gradeItem(b.getAttribute('data-id'), b.getAttribute('data-grade') === 'good');
        render();
        updateReviewPanel();
      });
    });
    // 关联跳转
    Array.prototype.forEach.call(document.querySelectorAll('.kb-rel-link'), function (b) {
      b.addEventListener('click', function () {
        activeCat = 'all';
        keyword = '';
        document.getElementById('search').value = '';
        renderCats();
        render();
        focusItem(b.getAttribute('data-goto'));
      });
    });
  }

  function focusItem(id) {
    var el = document.getElementById('kb-' + id);
    if (!el) return;
    el.classList.add('open');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.style.transition = 'box-shadow .3s';
    el.style.boxShadow = '0 0 0 3px var(--accent-soft)';
    setTimeout(function () { el.style.boxShadow = ''; }, 1800);
  }

  function rvLabel(id) {
    var r = rvState()[id];
    if (!r) return '未入队 · 阅读后点「记住了/再想想」开始复习';
    var n = RV_INTERVALS[r.box];
    return r.box >= 5 ? '已掌握（' + n + ' 天后再巩固）' :
      '第 ' + (r.box + 1) + ' 阶 · ' + (r.due <= today() ? '今日到期' : r.due + ' 复习');
  }

  document.getElementById('search').addEventListener('input', function (e) {
    keyword = e.target.value;
    render();
  });

  document.getElementById('onlyInst').addEventListener('change', function (e) {
    onlyInst = e.target.checked;
    render();
  });

  // 站内锚点跳转（从首页/看板页跳来）
  window.addEventListener('hashchange', function () {
    if (location.hash.indexOf('#kb-') === 0) focusItem(location.hash.slice(4));
  });
})();
</script>
</body>
</html>

name: Enable GitHub Pages (one-shot)

# 一次性启用 Pages：通过 Actions 内置 GITHUB_TOKEN 调 Pages API。
# 若 Pages 已启用，POST 返回 409，本步骤不视为失败。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages (source: gh-pages branch)
        run: |
          set -x
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          cat /tmp/resp.json || true
          if [ "$code" = "201" ] || [ "$code" = "409" ]; then
            echo "OK (http $code)"
          else
            echo "Failed with http $code"; exit 1
          fi

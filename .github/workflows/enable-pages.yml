name: Enable GitHub Pages (one-shot)

# 一次性启用 Pages：通过 Actions 内置 GITHUB_TOKEN 调 Pages API。
# 若 Pages 已启用，POST 返回 409，本步骤不视为失败。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  administration: write
  contents: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Pages via API
        run: |
          set -x
          code=$(curl -s -o resp.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "HTTP $code" > _pages_enable_result.txt
          cat resp.json >> _pages_enable_result.txt || true
          cat _pages_enable_result.txt
      - name: Commit result for diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _pages_enable_result.txt
          git commit -m "chore: pages enable attempt result" || echo "nothing to commit"
          git push
